        "hclegacy-record-id"}, {"identifier": "10.5281/zenodo.10984470", "scheme":
        "doi"}], "rights": [{"id": "cc-by-nc-4.0", "title": {"en": "Creative Commons
        Attribution Non Commercial 4.0 International"}, "description": {"en": "Allows
        re-distribution and re-use of a licensed work on the condition that the creator
        is appropriately credited and that the re-use is not for commercial purposes."},
        "icon": "cc-by-nc-icon", "props": {"url": "https://creativecommons.org/licenses/by-nc/4.0/legalcode",
        "scheme": "spdx"}}], "description": "The importance of communication skills
        cannot be disregarded, especially today where communication plays a crucial
        part in our daily lives. Furthermore, poor communication skills may lead to
        the inability to maintain professional and personal relationships. With, this
        study aims to investigate and determine whether there is a statistically significant
        correlation between students majoring in the humanities and social sciences
        and their level of proficiency in social academic communication skills. This
        correlational study is delimited to thirty (30) students under Humanities
        and Social Sciences strand at a higher educational institution residing at
        the City of San Fernando, Pampanga, Philippines. The researchers of this study
        have utilized random sampling technique in selecting the respondents. The
        data of the assessment and survey questionnaires gathered from the respondents
        were evaluated using descriptive statistics. It is revealed through this study
        that there is a positive inclination among students for active participation
        in various group discussions, emphasizing the significance of collaborative
        learning experiences. Students perceive the connection between communication
        skills and success within their respective academic strands, indicating the
        perceived impact of effective communication on academic achievement. Additionally,
        it is recommended for some humanities and social sciences students to consider
        interpersonal interaction. This recommendation may lead to the improvement
        of knowledge, attending extracurricular performances, understanding textbooks,
        and using qualitative techniques such as interviewing to understand students''
        experiences and barriers to communication."}, "custom_fields": {"journal:journal":
