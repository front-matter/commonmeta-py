        "rs:content_html": "<p>Bei der Einf\u00fchrung eines Forschungsinformationssystems
        (FIS) stellt die rechtliche Seite oftmals eine gro\u00dfe Herausforderungen
        dar. Wie ist es mit dem Datenschutz? F\u00fcr was muss das Einverst\u00e4ndnis
        der Forschenden eingeholt werden und auf welcher rechtlichen Grundlage? Wie
        sieht es aus mit der Beteiligung des Personals an diesen Prozessen?</p>\n<p>An
        der TIB \u2013 Leibniz-Informationszentrum Technik und Naturwissenschaften
        und Universit\u00e4tsbibliothek wurden diese Fragen gestellt und unter Beteiligung
        der Datenschutzbeauftragten und des von Beginn an eingebundenen Personalrats
        beantwortet. Das Ergebnis liegt nun in Form einer nachnutzbaren Musterdienstvereinbarung
        (<a href=\"https://projects.tib.eu/fileadmin/data/openresearchinformation/docs/Musterdienstvereinbarung_VIVO.pdf\">PDF-Datei</a>,
        <a href=\"https://projects.tib.eu/fileadmin/data/openresearchinformation/docs/Musterdienstvereinbarung_VIVO.docx\">Word-Datei</a>)
        vor.</p>\n<p>Beitrag im TIB-Blog: <a href=\"https://blogs.tib.eu/wp/tib/2021/07/08/eine-musterdienstvereinbarung-fuer-vivo/\">https://blogs.tib.eu/wp/tib/2021/07/08/eine-musterdienstvereinbarung-fuer-vivo/</a></p>\n<h1>Zitiervorschlag</h1>\n<p>Vierkant,
        Paul. \"Eine Musterdienstvereinbarung F\u00fcrs FIS \u2013 Ein Beispiel Der
        TIB.\" <em>Blog der DINI AGs FIS &amp; EPUB</em>, 2021. <a href=\"https://doi.org/10.57689/DINI-BLOG.20210712\">https://doi.org/10.57689/DINI-BLOG.20210712</a>.</p>\n<hr
        />\n<p><em><span dir=\"ltr\" role=\"presentation\">Diese</span>r Beitrag <span
        dir=\"ltr\" role=\"presentation\">\u2013</span> <span dir=\"ltr\" role=\"presentation\">ausgenommen</span>
        <span dir=\"ltr\" role=\"presentation\">Zitate</span> <span dir=\"ltr\" role=\"presentation\">und</span>
        <span dir=\"ltr\" role=\"presentation\">anderweitig </span><span dir=\"ltr\"
        role=\"presentation\">gekennzeichnete</span> <span dir=\"ltr\" role=\"presentation\">Teile</span>
        <span dir=\"ltr\" role=\"presentation\">\u2013</span> <span dir=\"ltr\" role=\"presentation\">ist</span>
        lizenziert <span dir=\"ltr\" role=\"presentation\">unter</span> <span dir=\"ltr\"
        role=\"presentation\">der</span> <a href=\"http://creativecommons.org/licenses/by/4.0/\"
        rel=\"license\">Creative Commons Namensnennung 4.0 International Lizenz</a>
        (<span dir=\"ltr\" role=\"presentation\">CC</span> <span dir=\"ltr\" role=\"presentation\">BY</span>
        <span dir=\"ltr\" role=\"presentation\">4.0</span>).</em><br />\n<a href=\"http://creativecommons.org/licenses/by/4.0/\"
        rel=\"license\"><img decoding=\"async\" src=\"https://i.creativecommons.org/l/by/4.0/88x31.png\"
        alt=\"Creative Commons Lizenzvertrag\" /></a></p>", "rs:image": "https://blog.dini.de/EPub_FIS/wp-content/uploads/2021/07/DINI-Blog-FISE-Pub-16.png",
        "rs:generator": {"id": "WordPress", "title": {"en": "WordPress"}}, "rs:featured":
